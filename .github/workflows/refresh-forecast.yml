name: Refresh Rawalpindi AI Forecast

on:
  schedule:
    # Run daily at 03:17 UTC
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install model dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify vendored model
        run: python src/verify_model.py

      - name: Fetch live weather and refresh AI dengue forecast
        run: python src/update_live_forecast.py

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_forecast.json data/rawalpindi_uc_forecast.geojson
          git diff --cached --quiet || git commit -m "chore: refresh live weather forecast [skip ci]"
          git push

      - name: Sync fresh data to gh-pages (live site)
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          git checkout main -- data/latest_forecast.json data/rawalpindi_uc_forecast.geojson
          git diff --quiet || git commit -m "chore: sync forecast data to live site [skip ci]"
          git push origin gh-pages
