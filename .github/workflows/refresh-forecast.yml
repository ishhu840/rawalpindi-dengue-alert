name: Refresh Rawalpindi AI Forecast

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install model dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch weather and refresh AI forecast
        run: python src/update_live_forecast.py

      - name: Publish refreshed forecast data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data app/data
          git diff --cached --quiet || git commit -m "Refresh live weather forecast"
          git push
