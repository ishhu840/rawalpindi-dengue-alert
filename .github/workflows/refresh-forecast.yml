name: Refresh Rawalpindi AI Forecast

on:
  schedule:
    # Run daily at 03:17 UTC
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install model dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify vendored model
        run: python src/verify_model.py

      - name: Fetch live weather and refresh AI dengue forecast
        run: python src/update_live_forecast.py

      - name: Commit updated forecast data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_forecast.json data/rawalpindi_uc_forecast.geojson
          git diff --cached --quiet || git commit -m "chore: refresh live weather forecast [skip ci]"
          git push

      # ── Re-deploy the live GitHub Pages site with the fresh data ──────────
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload repo root as Pages artifact (with fresh data)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
